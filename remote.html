<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pop Up Remote Scanner</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    body {
      padding: 0.75rem;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: text !important; /* Allow text selection */
    }
    .remote-container {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .main-value-card {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .primary-value-display {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      margin: 1rem 0;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="remote-container">
    <!-- Main Value Display -->
    <div class="main-value-card" style="margin-top: 0;">
      <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Nilai Utama Terdeteksi</div>
      
      <div id="descPrimaryVal" class="primary-value-display">--</div>
      
      <div id="remoteTrendBadge" class="badge" style="background: rgba(148, 163, 184, 0.15); color: var(--text-muted); font-size: 0.8rem; padding: 0.4rem 0.8rem;">
        ▶ STABIL
      </div>
    </div>
    
    <div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 1rem;">
      *Nilai di atas bisa diblok dan dicopy (Salin). Deteksi akan otomatis aktif bersamaan dengan OCR Utama.
    </div>
  </div>

  <script src="lib/capture.js"></script>
  <script src="lib/logger.js"></script>
  <script type="module" src="remote.js"></script>
</body>
</html>
